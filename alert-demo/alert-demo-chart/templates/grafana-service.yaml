apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -c -o alert-demo-chart
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: grafana
  name: grafana
spec:
  type: {{ .Values.grafana.service.type }}
  ports:
    - name: "3000"
      port: {{ .Values.grafana.service.port }}
      targetPort: 3000
  selector:
    io.kompose.service: grafana
