apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -c -o alert-demo-chart
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: rabbitmq
  name: rabbitmq
spec:
  type: {{ .Values.rabbitmq.service.type }}
  ports:
    - name: "5672"
      port: {{ .Values.rabbitmq.service.ports.amqp }}
      targetPort: 5672
    - name: "15672"
      port: {{ .Values.rabbitmq.service.ports.management }}
      targetPort: 15672
  selector:
    io.kompose.service: rabbitmq
