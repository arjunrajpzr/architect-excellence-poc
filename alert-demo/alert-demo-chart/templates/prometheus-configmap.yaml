apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    io.kompose.service: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'alert-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['alert-demo:9000']